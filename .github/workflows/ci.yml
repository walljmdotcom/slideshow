name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore source/Slideshow.sln

      - name: Build with warnings as errors
        run: dotnet build source/Slideshow.sln -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test tests/SlideshowWebServer.Tests/SlideshowWebServer.Tests.csproj -c Release --no-build --verbosity normal

      - name: Verify trimmed single-file publish
        run: >
          dotnet publish source/SlideshowWebServer.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -warnaserror
          -o ./dist/linux-x64
