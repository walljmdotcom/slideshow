name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet test source/Slideshow.sln -c Release -warnaserror

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            folder: linux-x64
          - runtime: linux-arm64
            folder: linux-arm
          - runtime: osx-arm64
            folder: mac-arm
          - runtime: osx-x64
            folder: mac-x64
          - runtime: win-x64
            folder: win-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore source/SlideshowWebServer.csproj -r ${{ matrix.runtime }}

      - name: Build and publish
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          dotnet publish source/SlideshowWebServer.csproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            --no-restore \
            --self-contained true \
            -p:PublishSingleFile=true \
            -warnaserror \
            -o ./dist/${{ matrix.folder }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slideshow-${{ matrix.folder }}
          path: ./dist/${{ matrix.folder }}
          retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Organize release structure
        run: |
          mkdir -p dist
          mv artifacts/slideshow-linux-x64 dist/linux-x64
          mv artifacts/slideshow-linux-arm dist/linux-arm
          mv artifacts/slideshow-mac-arm dist/mac-arm
          mv artifacts/slideshow-mac-x64 dist/mac-x64
          mv artifacts/slideshow-win-x64 dist/win-x64

      - name: Create release archives
        run: |
          cd dist
          tar --owner=root --group=root -czf ../slideshow-linux-x64.tar.gz -C linux-x64/ .
          tar --owner=root --group=root -czf ../slideshow-linux-arm.tar.gz -C linux-arm/ .
          tar --owner=root --group=root -czf ../slideshow-mac-arm.tar.gz -C mac-arm/ .
          tar --owner=root --group=root -czf ../slideshow-mac-x64.tar.gz -C mac-x64/ .
          zip -r ../slideshow-win-x64.zip win-x64/

      - name: Write checksums
        run: sha256sum slideshow-*.tar.gz slideshow-*.zip > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            slideshow-linux-x64.tar.gz
            slideshow-linux-arm.tar.gz
            slideshow-mac-arm.tar.gz
            slideshow-mac-x64.tar.gz
            slideshow-win-x64.zip
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload complete dist folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slideshow-all-platforms
          path: ./dist
          retention-days: 90
